global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: sportline
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["host.docker.internal:3010"]
        labels: {group: application}
  - job_name: windows
    static_configs:
      - targets: ["host.docker.internal:9183"]
        labels: {group: computer}
