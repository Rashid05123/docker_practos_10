global:
  resolve_timeout: 10s
route:
  receiver: reserve-webhook
  group_by: [group, alertname]
  group_wait: 2s
  group_interval: 10s
  repeat_interval: 1m
  routes:
    # у приложения и компьютера свои основные точки, данные не смешиваются
    - receiver: application-webhook
      matchers: ['group="application"']
      continue: true
    - receiver: computer-webhook
      matchers: ['group="computer"']
      continue: true
    # дополнительная точка получает копию каждого события
    - receiver: reserve-webhook
      matchers: ['group=~"application|computer"']
receivers:
  - name: application-webhook
    webhook_configs:
      - url: http://host.docker.internal:9184/application
        send_resolved: true
  - name: computer-webhook
    webhook_configs:
      - url: http://host.docker.internal:9184/computer
        send_resolved: true
  - name: reserve-webhook
    webhook_configs:
      - url: http://host.docker.internal:9185/reserve
        send_resolved: true
