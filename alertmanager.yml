global:
  resolve_timeout: 10s
route:
  receiver: primary-webhook
  group_by: [alertname, source]
  group_wait: 2s
  group_interval: 10s
  repeat_interval: 1m
  routes:
    - receiver: primary-webhook
      matchers: ['source="computer"']
      continue: true
    - receiver: computer-webhook
      matchers: ['source="computer"']
receivers:
  - name: primary-webhook
    webhook_configs:
      - url: http://host.docker.internal:9184/primary
        send_resolved: true
  - name: computer-webhook
    webhook_configs:
      - url: http://host.docker.internal:9184/computer
        send_resolved: true
